name: Deploy para GitHub Pages

on:
  workflow_dispatch:
  # Deploy automático desativado até o site ficar pronto.
  # Para reativar, descomente:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build (SSG)
        run: npm run build
        # Publicado em nicolasdequeiroz.github.io/desenhe/ (repositório
        # "desenhe", sem domínio próprio): usa o nome do próprio repositório
        # como subcaminho, então funciona sem editar isto de novo se o repo
        # for renomeado.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Fallback 404 para rotas do SPA
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
