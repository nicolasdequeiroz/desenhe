<!doctype html>
<html lang="pt-BR" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Cor da UI do navegador (barra de status / barra de endereço no iOS
      Safari e Chrome Android). Sem isto, o Safari amostra o fundo do
      <body>, que é bege de propósito (recorte da gaveta do rodapé), e
      pinta as barras de bege. Fixamos na cor escura do site.
    -->
    <meta name="theme-color" content="#171310" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Sem título e sem meta description aqui de propósito: quem define os
      dois é o componente Seo de cada página, e o pré-render injeta o
      resultado neste mesmo head. Deixá-los no template fazia toda página
      sair com duas tags de cada, e o buscador escolhendo qual valia. O
      texto padrão da home vive em SITE.defaultTitle / SITE.description.
    -->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
